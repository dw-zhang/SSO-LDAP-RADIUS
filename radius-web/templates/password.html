{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>修改面板登录密码</h2>
  <p class="muted">改的是打开这个管理面板的登录密码（不是 RADIUS 账号密码）。
     修改后<strong>即时生效</strong>：下次登录用新密码，当前已登录的会话不受影响。</p>
  {% if not from_file %}
  <div class="flash warn">当前密码来自部署时的环境变量。第一次修改后，密码将保存在服务器
    <code>/opt/SharkSSO/radius/.adminpw</code>（权限 600），以后以这里为准。</div>
  {% else %}
  <p class="muted">当前密码来源：<span class="pill v">密码文件 .adminpw</span></p>
  {% endif %}
  <form method="post" style="max-width:420px;">
    <label>当前密码</label>
    <input type="password" name="cur" required autocomplete="current-password">
    <label>新密码（至少 8 位）</label>
    <input type="password" name="p1" required minlength="8" autocomplete="new-password">
    <label>确认新密码</label>
    <input type="password" name="p2" required minlength="8" autocomplete="new-password">
    <div style="margin-top:14px;"><button class="btn">确认修改</button></div>
  </form>
</div>
{% endblock %}
